<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1590" viewBox="0 0 900 1590" role="img" aria-labelledby="title desc">
  <title id="title">Joint V4 method workflow</title>
  <desc id="desc">Compact vertical workflow: residue mapping and preparation; accessibility and single-site screening; surface sectors and mutation combination selection; panel results.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4 L0,8" fill="#646464"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111}
      .panel{font-size:32px;font-weight:700}
      .head{font-size:25px;font-weight:400;text-anchor:middle}
      .tool{font-size:21px;font-weight:400;text-anchor:middle}
      .small{font-size:17px;text-anchor:middle}
      .label{font-size:18px;text-anchor:middle}
      .dash{stroke:#909090;stroke-width:1.5;stroke-dasharray:8 7}
      .flow{fill:none;stroke:#646464;stroke-width:1.6;marker-end:url(#arrow)}
      .line{fill:none;stroke:#646464;stroke-width:1.5}
    </style>
  </defs>
  <rect width="900" height="1590" fill="#fff"/>
  <text x="36" y="50" class="panel">a</text>
  <g transform="translate(-40 0)">

  <!-- User-provided transparent protein image, embedded for portability. -->
  <image x="435" y="72" width="110" height="116" href="data:image/png;base64,"/>
  <text x="490" y="218" class="small">ECD structure + sequence</text>
  <path d="M490 230 V270" class="flow"/>

  <!-- Step 1: residue identity and prediction context. -->
  <g aria-label="Step 1: residue mapping and preparation">
    <rect x="110" y="270" width="760" height="145" fill="#f1f2fa" class="dash"/>
    <text x="490" y="318" class="head">1. Residue mapping + preparation</text>
    <text x="490" y="368" class="small">Chain selection · WT check · normalized context + residue map</text>
  </g>

  <!-- Step 2: the three parallel evidence lines. -->
  <path d="M490 415 V490" class="flow"/>
  <text x="775" y="460" class="label">mapped context</text>
  <g aria-label="Step 2: accessibility and single-site screening">
    <rect x="90" y="490" width="800" height="330" fill="#edf6ea" class="dash"/>
    <text x="490" y="537" class="head">2. Accessibility + single-site screening</text>

    <rect x="115" y="590" width="230" height="185" fill="#f1f2fa" class="dash"/>
    <text x="230" y="640" class="tool">ProCaliper</text>
    <text x="230" y="683" class="small"><tspan x="230">Native SASA comparison</tspan><tspan x="230" dy="23">SASA / rSASA cross-check</tspan></text>

    <rect x="375" y="590" width="230" height="185" fill="#faf9f2" class="dash"/>
    <text x="490" y="640" class="tool">DiscoTope-3.0</text>
    <text x="490" y="683" class="small"><tspan x="490">Optional soft</tspan><tspan x="490" dy="23">epitope prior</tspan></text>

    <rect x="635" y="590" width="230" height="185" fill="#f1f2fa" class="dash"/>
    <text x="750" y="640" class="tool">SPURS single</text>
    <text x="750" y="683" class="small"><tspan x="750">Single-site</tspan><tspan x="750" dy="23">stability screen</tspan></text>
  </g>

  <!-- Step 3: sectors, candidate combinations, then combination evidence. -->
  <path d="M490 820 V870" class="flow"/>
  <text x="775" y="852" class="label">single-site options</text>
  <g aria-label="Step 3: surface sectors and mutation combination selection">
    <rect x="90" y="870" width="800" height="470" fill="#faf9f2" class="dash"/>
    <text x="490" y="917" class="head">3. Sectors + mutation combination selection</text>
    <text x="490" y="970" class="small">Connected geodesic surface sectors</text>
    <path d="M490 982 V1000" class="flow"/>
    <text x="490" y="1032" class="small">2/3-site candidate search</text>

    <path d="M490 1043 V1055 H315 V1070" class="flow"/>
    <path d="M490 1055 H665 V1070" class="flow"/>
    <rect x="185" y="1070" width="260" height="110" fill="#f1f2fa" class="dash"/>
    <text x="315" y="1112" class="tool">SPURS multi</text>
    <text x="315" y="1145" class="small">Combination stability</text>
    <rect x="535" y="1070" width="260" height="110" fill="#edf6ea" class="dash"/>
    <text x="665" y="1112" class="tool">FoldX</text>
    <text x="665" y="1145" class="small">Combination confirmation</text>

    <path d="M315 1180 V1200 H490 M665 1180 V1200 H490" class="line"/>
    <path d="M490 1200 V1212" class="flow"/>
    <text x="490" y="1245" class="small">Stability + extrapolation gates</text>
    <text x="490" y="1280" class="small">Deterministic panel selection</text>
  </g>

  <!-- Step 4: final panel and status. -->
  <path d="M490 1340 V1400" class="flow"/>
  <text x="775" y="1377" class="label">selected panel</text>
  <g aria-label="Step 4: panel results">
    <rect x="110" y="1400" width="760" height="145" fill="#f1f2fa" class="dash"/>
    <text x="490" y="1447" class="head">4. Panel results</text>
    <text x="490" y="1490" class="small"><tspan x="490">Selected panel + audit outputs</tspan><tspan x="490" dy="24">Formal / blocked / preview status</tspan></text>
  </g>
  </g>
</svg>
