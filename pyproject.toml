[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecd-epitope-scanner"
version = "1.1.2"
description = "Auditable local ECD epitope-region mutation design workbench"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3", "fastapi>=0.115,<2", "uvicorn>=0.30,<1", "python-multipart>=0.0.9",
  "requests>=2.31", "biopython>=1.83", "numpy>=1.26", "networkx>=3.2",
  "pandas>=2.0", "dnachisel>=3.2", "gemmi>=0.6", "scipy>=1.11",
  "jsonschema>=4.21,<5", "xlrd>=2.0.1,<3", "openpyxl>=3.1,<4",
]

[project.scripts]
ecd-epitope-scanner = "ecd_epitope_scanner.cli:main"

[tool.setuptools]
packages = ["ecd_epitope_scanner", "ecd_epitope_scanner.surface_patch", "ecd_epitope_scanner.surface_patch.backend", "ecd_epitope_scanner.joint_design", "ecd_epitope_scanner.joint_design_v4", "ecd_epitope_scanner.integrations", "ecd_epitope_scanner.integrations.workers"]

[tool.setuptools.package-dir]
ecd_epitope_scanner = "."

[tool.setuptools.package-data]
ecd_epitope_scanner = ["schemas/*.json", "web/*.html", "web/*.js", "web/*.css", "web/i18n/*.json", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: end-to-end pipeline checks that do not call external models",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["web/vendor", "web/backup_*", "vendor", "tests/fixtures/grasp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
files = ["api.py", "jobs.py", "pipeline.py", "models.py", "config.py"]
