<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ECD Epitope Workbench</title>
  <link rel="stylesheet" href="/assets/vendor/pdbe-molstar-light-3.10.1.css">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="appbar">
    <div class="brand-block">
      <div class="brand-mark" aria-hidden="true">E</div>
      <div>
        <strong>ECD Epitope Workbench</strong>
        <span>胞外区结构分区组合突变设计</span>
      </div>
    </div>
    <form id="run-form" class="run-form">
      <fieldset class="segmented" aria-label="输入类型">
        <label><input type="radio" name="input-type" value="uniprot" checked><span>UniProt</span></label>
        <label><input type="radio" name="input-type" value="pdb_id"><span>PDB ID</span></label>
      </fieldset>
      <label class="field compact-field">
        <span id="identifier-label">蛋白 accession</span>
        <input id="identifier" name="identifier" value="Q9NZQ7" autocomplete="off" required>
      </label>
      <label class="field chain-field">
        <span>链</span>
        <input id="chain" name="chain" maxlength="4" placeholder="自动">
      </label>
      <button id="run-button" class="primary-button" type="submit">运行设计</button>
      <button id="open-upload" class="secondary-button" type="button">上传结构</button>
    </form>
    <div class="brand-actions">
      <button id="btn-lang" class="secondary-button" type="button">EN</button>
      <button id="export-offline" class="secondary-button" type="button" disabled>导出离线 HTML</button>
    </div>
  </header>

  <nav id="steps" class="steps-nav" aria-label="分析步骤"></nav>

  <section class="job-strip" aria-live="polite">
    <div class="job-state-row">
      <div>
        <span id="job-state" class="status-badge neutral">未运行</span>
        <strong id="job-message">可载入冻结示例，或提交 UniProt/PDB。</strong>
      </div>
      <span id="job-percent" class="tabular">0%</span>
    </div>
    <div class="progress-track" aria-hidden="true"><span id="job-progress"></span></div>
    <p id="job-error" class="error-message" hidden></p>
  </section>

  <main id="workspace" class="workspace">
    <section class="structure-column" aria-label="蛋白结构">
      <div class="viewer-shell">
        <div id="viewer" class="viewer" aria-label="蛋白三维结构"></div>
        <div id="beads-viewer" class="viewer" aria-label="蛋白三维结构（珠子模式）" hidden></div>
        <div id="viewer-placeholder" class="viewer-placeholder">
          <strong>结构审查画布</strong>
          <span>载入示例或提交蛋白后显示结构</span>
          <button id="load-demo" type="button" class="secondary-button">载入 PD-L1 示例</button>
        </div>
        <div class="viewer-toolbar" aria-label="结构显示控制">
          <div class="representation-switch" role="group" aria-label="渲染引擎">
            <button data-engine="molstar" type="button" aria-pressed="true" title="PDBe Mol* 卡通渲染">卡通</button>
            <button data-engine="beads" type="button" aria-pressed="false" title="3Dmol 逐残基珠子渲染">珠子</button>
          </div>
          <div class="representation-switch" role="group" aria-label="结构展示模式">
            <button data-representation="cartoon" type="button" aria-pressed="true" title="卡通主链">主链</button>
            <button data-representation="ball-and-stick" type="button" aria-pressed="false" title="球棍显示侧链几何">球棍</button>
            <button data-representation="molecular-surface" type="button" aria-pressed="false" title="分子表面展示">表面</button>
          </div>
          <button id="reset-view" type="button" title="复位结构视角">复位</button>
          <button id="spin-view" type="button" aria-pressed="false" title="切换结构旋转">旋转</button>
          <button id="clear-focus" type="button" title="清除当前位点高亮">清除定位</button>
        </div>
        <div id="legend" class="legend" aria-label="结构图例"></div>
      </div>
    </section>

    <aside id="panel" class="inspector" aria-label="分析步骤面板"></aside>
  </main>

  <section class="sequence-panel" aria-labelledby="sequence-heading">
    <header class="panel-heading sequence-heading-row">
      <div>
        <h2 id="sequence-heading">序列审查</h2>
        <p id="sequence-subtitle">UniProt 编号与结构选择保持同步</p>
      </div>
      <div class="sequence-controls">
        <fieldset class="segmented small" aria-label="序列类型">
          <label><input type="radio" name="sequence-mode" value="aa" checked><span>氨基酸</span></label>
          <label><input type="radio" name="sequence-mode" value="dna"><span>编码片段</span></label>
        </fieldset>
        <label class="inline-select">构建体
          <select id="sequence-design"><option value="wt">WT ECD</option></select>
        </label>
      </div>
    </header>
    <div class="sequence-compare">
      <div class="sequence-track">
        <div class="sequence-label"><strong>WT</strong><span id="wt-sequence-meta"></span>
          <span class="copy-row">
            <button id="copy-wt-aa" type="button" class="text-button">⧉ AA</button>
            <button id="copy-wt-nt" type="button" class="text-button">⧉ CDS</button>
          </span>
        </div>
        <div id="wt-sequence" class="sequence" tabindex="0" aria-label="野生型序列"></div>
      </div>
      <div class="sequence-track">
        <div class="sequence-label"><strong>设计</strong><span id="mutant-sequence-meta">选择一个构建体</span>
          <span class="copy-row">
            <button id="copy-mut-aa" type="button" class="text-button">⧉ AA</button>
            <button id="copy-mut-nt" type="button" class="text-button">⧉ CDS</button>
          </span>
        </div>
        <div id="mutant-sequence" class="sequence" tabindex="0" aria-label="突变体序列"></div>
      </div>
    </div>
  </section>

  <dialog id="upload-dialog" class="upload-dialog">
    <form id="upload-form" method="dialog">
      <header class="dialog-heading">
        <div>
          <h2>上传已下载结构</h2>
          <p>PDB/mmCIF；建议同时提供 UniProt accession 以建立规范编号。</p>
        </div>
        <button id="close-upload" type="button" class="icon-close" aria-label="关闭">×</button>
      </header>
      <label class="field"><span>结构文件</span><input id="upload-structure" type="file" accept=".pdb,.ent,.cif,.mmcif" required></label>
      <div class="dialog-grid">
        <label class="field"><span>UniProt accession</span><input id="upload-accession" placeholder="推荐填写"></label>
        <label class="field"><span>目标链</span><input id="upload-chain" placeholder="自动"></label>
      </div>
      <details>
        <summary>没有 UniProt 时手动提供序列与 ECD</summary>
        <label class="field"><span>完整蛋白序列</span><textarea id="upload-sequence" rows="4"></textarea></label>
        <div class="dialog-grid">
          <label class="field"><span>ECD 起点</span><input id="upload-ecd-start" type="number" min="1"></label>
          <label class="field"><span>ECD 终点</span><input id="upload-ecd-end" type="number" min="1"></label>
        </div>
      </details>
      <button id="submit-upload" class="primary-button full-width" type="submit">提交结构分析</button>
    </form>
  </dialog>

  <dialog id="af3-dialog" class="upload-dialog">
    <form id="af3-form" method="dialog">
      <header class="dialog-heading">
        <div>
          <h2>补充官方 AF3 输出</h2>
          <p>需要 top-ranked mmCIF 和对应 confidences JSON。</p>
        </div>
        <button id="close-af3" type="button" class="icon-close" aria-label="关闭">×</button>
      </header>
      <label class="field"><span>AF3 model CIF</span><input id="af3-structure" type="file" accept=".cif,.mmcif" required></label>
      <label class="field"><span>AF3 confidences JSON</span><input id="af3-confidence" type="file" accept=".json" required></label>
      <label class="check-row"><input id="af3-confirm" type="checkbox" required><span>确认文件来自官方 AlphaFold 3 输出；系统不会把 AFDB/AF2 当作 AF3。</span></label>
      <button class="primary-button full-width" type="submit">上传并继续作业</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/assets/vendor/3Dmol-min.js"></script>
  <script src="/assets/vendor/pdbe-molstar-plugin-3.10.1.js"></script>
  <script src="/assets/renderer.js"></script>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
